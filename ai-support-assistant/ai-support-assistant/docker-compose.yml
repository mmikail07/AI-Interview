# Brings up Ollama + the FastAPI backend together.
#
# First run (one-time, needs internet to pull the model):
#   docker compose up -d
#   docker compose exec ollama ollama pull llama3.1
#
# After the model is cached the whole stack runs fully offline.
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_OLLAMA_BASE_URL: http://ollama:11434
      APP_OLLAMA_MODEL: llama3.1
    depends_on:
      ollama:
        condition: service_started

volumes:
  ollama_models:
